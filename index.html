<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bill helper</title>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <h1>Bill helper</h1>
    <p id="version">v1</p>
    <main id="app">
      <form id="tip-form">
        <p>
          <label for="bill">Bill ($)</label>
          <input id="bill" name="bill" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" />
        </p>
        <p>
          <label for="tip-percent">Tip (%)</label>
          <input id="tip-percent" name="tipPercent" type="text" inputmode="decimal" autocomplete="off" value="18" />
        </p>
        <p>
          <label for="people">People</label>
          <input id="people" name="people" type="text" inputmode="numeric" autocomplete="off" value="1" />
        </p>
      </form>
      <div id="messages" role="status"></div>
      <dl id="amounts" hidden>
        <dt>Tip</dt>
        <dd><output id="tip-amount" form="tip-form"></output></dd>
        <dt>Total</dt>
        <dd><output id="total-amount" form="tip-form"></output></dd>
        <dt>Per person</dt>
        <dd><output id="per-person-amount" form="tip-form"></output></dd>
      </dl>
    </main>
  </body>
</html>
